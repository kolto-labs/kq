[workspace]
resolver = "2"
members = ["crates/kq-format", "crates/kq-index", "crates/kq-cli", "crates/kq-ncs"]

exclude = ["vendor/kotor-formats"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/kolto-labs/kq"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
rayon = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Keep the format crates in-tree so clean CI runners do not need access to the
# private upstream repository that originally supplied this git dependency.
kotor-ncs-isa = { path = "vendor/kotor-formats/crates/kotor-ncs-isa" }
kotor-ncs = { path = "vendor/kotor-formats/crates/kotor-ncs" }
kotor-formats = { path = "vendor/kotor-formats/crates/kotor-formats" }
kotor-diff = { path = "vendor/kotor-formats/crates/kotor-diff", features = ["json"] }
