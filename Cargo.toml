[workspace]
resolver = "2"
members = ["crates/kq-format", "crates/kq-index", "crates/kq-cli", "crates/kq-ncs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/kolto-labs/kq"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
rayon = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# One git ref for every crate from kotor-formats (Cargo resolves a git source once).
kotor-ncs-isa = { git = "https://github.com/kolto-labs/kotor-formats", rev = "f223b4f573e3b72a25d2ec5d606e101ddbb875ad" }
kotor-ncs = { git = "https://github.com/kolto-labs/kotor-formats", rev = "f223b4f573e3b72a25d2ec5d606e101ddbb875ad" }
kotor-formats = { git = "https://github.com/kolto-labs/kotor-formats", rev = "f223b4f573e3b72a25d2ec5d606e101ddbb875ad" }
kotor-diff = { git = "https://github.com/kolto-labs/kotor-formats", rev = "f223b4f573e3b72a25d2ec5d606e101ddbb875ad", features = ["json"] }
